<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">會員 Wallet 與旅宿 CRM 旅程示意圖</title>
  <desc id="desc">手機 Wallet 把房卡、票券、優惠、身份與 CRM 旅客紀錄串成同一段旅程。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbf5ec"/><stop offset="1" stop-color="#d8c2a6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4c3429" flood-opacity="0.18"/></filter><style>.k{font-family:Arial,sans-serif;font-size:32px;letter-spacing:13px;fill:#c65f32;font-weight:800}.t{font-family:Georgia,serif;font-size:72px;fill:#241a16;font-weight:800}.s{font-family:Arial,sans-serif;font-size:30px;fill:#6f6258;font-weight:650}.h{font-family:Georgia,serif;font-size:38px;fill:#241a16;font-weight:800}.p{font-family:Arial,sans-serif;font-size:25px;fill:#2d2520;font-weight:800}.n{font-family:Arial,sans-serif;font-size:22px;fill:#74675d;font-weight:650}.a{stroke:#b9906c;stroke-width:8;stroke-linecap:round;fill:none}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1345" cy="155" r="155" fill="#fff7ee" opacity=".68"/><circle cx="180" cy="820" r="160" fill="#c65f32" opacity=".1"/>
  <g transform="translate(105 92)"><text class="k" y="0">MEMBER WALLET</text><text class="t" y="88">房卡不只是開門，也可以成為會員入口</text><text class="s" y="145">Wallet 把身份、憑證、優惠與住宿紀錄，串回旅宿 CRM 的服務旅程。</text></g>
  <g transform="translate(120 260)" filter="url(#shadow)">
    <rect width="420" height="585" rx="52" fill="#2b201b"/><rect x="82" y="62" width="256" height="462" rx="44" fill="#fffaf3"/><text class="k" x="105" y="118">WALLET</text><rect x="112" y="150" width="196" height="78" rx="22" fill="#e5efe6"/><text class="p" x="145" y="199">房卡憑證</text><rect x="112" y="250" width="196" height="78" rx="22" fill="#f1dbc2"/><text class="p" x="145" y="299">會員身份</text><rect x="112" y="350" width="196" height="78" rx="22" fill="#e9eef4"/><text class="p" x="145" y="399">優惠票券</text>
  </g>
  <g transform="translate(610 290)" filter="url(#shadow)">
    <rect width="830" height="525" rx="44" fill="#fffaf3" stroke="#dfd2c3" stroke-width="3"/><text class="k" x="54" y="72">CRM JOURNEY</text><text class="h" x="54" y="132">一張 Pass，可以接住 5 種互動</text>
    <g transform="translate(54 190)"><rect width="325" height="82" rx="24" fill="#e5efe6"/><text class="p" x="34" y="36">1 入住身份</text><text class="n" x="34" y="66">會員 / 訂單 / 房號</text><rect x="405" width="325" height="82" rx="24" fill="#f1dbc2"/><text class="p" x="439" y="36">2 門禁憑證</text><text class="n" x="439" y="66">Wallet / QR / NFC</text><rect y="118" width="325" height="82" rx="24" fill="#f7efe6"/><text class="p" x="34" y="154">3 服務提醒</text><text class="n" x="34" y="184">早餐 / 房務 / 退房</text><rect x="405" y="118" width="325" height="82" rx="24" fill="#e5efe6"/><text class="p" x="439" y="154">4 優惠核銷</text><text class="n" x="439" y="184">餐飲 / 升等 / 周邊</text><rect y="236" width="730" height="82" rx="24" fill="#2b201b"/><text class="p" x="34" y="272" fill="#fffaf3">5 回到 CRM：偏好、消費、回訪與再行銷</text></g>
  </g>
  <path class="a" d="M545 555h85"/><path d="M628 540l30 15-30 15" fill="#b9906c"/><text class="n" x="105" y="930">圖片來源：Cellbedell / 會員 Wallet 與旅宿 CRM 旅程示意圖</text>
</svg>
