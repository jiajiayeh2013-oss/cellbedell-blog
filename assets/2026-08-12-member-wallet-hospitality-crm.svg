<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">會員 Wallet 與旅宿 CRM 主圖</title>
  <desc id="desc">手機 Wallet pass、會員身份、房卡、優惠與旅宿 CRM 形成一段完整旅客旅程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset="0.56" stop-color="#eadcc8"/>
      <stop offset="1" stop-color="#d2b491"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f241f"/>
      <stop offset="1" stop-color="#120e0c"/>
    </linearGradient>
    <linearGradient id="pass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe5"/>
      <stop offset="1" stop-color="#e0ecdf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#3c2a22" flood-opacity="0.18"/>
    </filter>
    <style>
      .k{font-family:Arial,sans-serif;font-size:30px;letter-spacing:14px;fill:#c65f32;font-weight:800}
      .title{font-family:Georgia,serif;font-size:74px;fill:#241a16;font-weight:800}
      .dek{font-family:Arial,sans-serif;font-size:29px;fill:#6f6258;font-weight:650}
      .h{font-family:Georgia,serif;font-size:40px;fill:#241a16;font-weight:800}
      .p{font-family:Arial,sans-serif;font-size:24px;fill:#342821;font-weight:800}
      .small{font-family:Arial,sans-serif;font-size:20px;fill:#786b61;font-weight:650}
      .white{fill:#fffaf3}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1338" cy="174" r="170" fill="#fff8ef" opacity="0.72"/>
  <circle cx="204" cy="828" r="168" fill="#c65f32" opacity="0.11"/>

  <g transform="translate(105 96)">
    <text class="k" y="0">MEMBER WALLET</text>
    <text class="title" y="92">把房卡、優惠與回訪放進同一段旅程</text>
    <text class="dek" y="150">Wallet 不只是開門工具，也可以是旅客身份、服務提醒與 CRM 的入口。</text>
  </g>

  <g transform="translate(132 254)" filter="url(#shadow)">
    <rect width="390" height="610" rx="72" fill="url(#phone)"/>
    <rect x="58" y="70" width="274" height="470" rx="44" fill="#fffaf3"/>
    <rect x="94" y="112" width="202" height="118" rx="28" fill="url(#pass)"/>
    <text class="k" x="118" y="154" font-size="22">STAY PASS</text>
    <text class="h" x="118" y="202" font-size="34">303</text>
    <rect x="94" y="254" width="202" height="58" rx="18" fill="#2b201b"/>
    <text class="p" x="126" y="291" fill="#fffaf3">開門憑證</text>
    <rect x="94" y="330" width="202" height="58" rx="18" fill="#e5efe6"/>
    <text class="p" x="126" y="367">會員身份</text>
    <rect x="94" y="406" width="202" height="58" rx="18" fill="#f1dbc2"/>
    <text class="p" x="126" y="443">早餐優惠</text>
    <circle cx="195" cy="568" r="16" fill="#fffaf3" opacity="0.75"/>
  </g>

  <g transform="translate(610 280)" filter="url(#shadow)">
    <rect width="850" height="560" rx="52" fill="#fffaf3" stroke="#decfbd" stroke-width="3"/>
    <text class="k" x="58" y="76">CRM JOURNEY</text>
    <text class="h" x="58" y="136">一張 Pass，接住旅客 5 個時刻</text>
    <g transform="translate(62 194)">
      <path d="M82 82 C206 10 326 10 450 82 S694 154 758 82" fill="none" stroke="#b9906c" stroke-width="8" stroke-linecap="round"/>
      <g transform="translate(0 0)">
        <circle cx="82" cy="82" r="58" fill="#e5efe6"/>
        <text class="p" x="39" y="76">預訂</text>
        <text class="small" x="22" y="110">pre check-in</text>
      </g>
      <g transform="translate(176 72)">
        <circle cx="82" cy="82" r="58" fill="#f1dbc2"/>
        <text class="p" x="39" y="76">抵達</text>
        <text class="small" x="30" y="110">開門憑證</text>
      </g>
      <g transform="translate(352 0)">
        <circle cx="82" cy="82" r="58" fill="#2b201b"/>
        <text class="p" x="39" y="76" fill="#fffaf3">入住</text>
        <text class="small" x="22" y="110" fill="#eadbcb">服務提醒</text>
      </g>
      <g transform="translate(528 72)">
        <circle cx="82" cy="82" r="58" fill="#e9eef4"/>
        <text class="p" x="39" y="76">優惠</text>
        <text class="small" x="30" y="110">即時核銷</text>
      </g>
      <g transform="translate(704 0)">
        <circle cx="82" cy="82" r="58" fill="#d66a34"/>
        <text class="p" x="39" y="76" fill="#fffaf3">回訪</text>
        <text class="small" x="30" y="110" fill="#fff0e5">CRM 記憶</text>
      </g>
    </g>
    <rect x="60" y="430" width="730" height="70" rx="24" fill="#f7efe6"/>
    <text class="p" x="96" y="474">重點不是多推訊息，而是在對的旅程節點給旅客需要的服務。</text>
  </g>

  <text class="small" x="112" y="920">圖片來源：Cellbedell / 會員 Wallet 與旅宿 CRM 旅程概念圖</text>
</svg>
