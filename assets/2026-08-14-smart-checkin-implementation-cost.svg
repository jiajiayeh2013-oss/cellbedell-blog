<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">智慧入住導入成本拆解</title>
  <desc id="desc">以三階段方式拆解中小旅宿導入智慧入住的成本：先跑流程、再接門禁、最後加上 AI 與會員服務。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbf5ec"/><stop offset="1" stop-color="#dbc6ab"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#4c3429" flood-opacity="0.18"/></filter><style>.k{font-family:Arial,sans-serif;font-size:32px;letter-spacing:13px;fill:#c65f32;font-weight:800}.t{font-family:Georgia,serif;font-size:72px;fill:#241a16;font-weight:800}.s{font-family:Arial,sans-serif;font-size:30px;fill:#6f6258;font-weight:650}.h{font-family:Georgia,serif;font-size:38px;fill:#241a16;font-weight:800}.p{font-family:Arial,sans-serif;font-size:25px;fill:#2d2520;font-weight:800}.n{font-family:Arial,sans-serif;font-size:22px;fill:#74675d;font-weight:650}.num{font-family:Arial,sans-serif;font-size:34px;fill:#fff;font-weight:900}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1335" cy="160" r="155" fill="#fff7ee" opacity=".68"/><circle cx="180" cy="825" r="165" fill="#c65f32" opacity=".1"/>
  <g transform="translate(105 92)"><text class="k" y="0">IMPLEMENTATION COST</text><text class="t" y="88">智慧入住成本，不只是一台 Kiosk</text><text class="s" y="145">中小旅宿更該問：哪些先做能減壓？哪些可以等流程穩了再加？</text></g>
  <g transform="translate(105 270)" filter="url(#shadow)">
    <rect width="1390" height="560" rx="46" fill="#fffaf3" stroke="#dfd2c3" stroke-width="3"/>
    <g transform="translate(65 76)"><rect width="375" height="405" rx="36" fill="#e5efe6"/><circle cx="70" cy="72" r="34" fill="#748864"/><text class="num" x="60" y="84">1</text><text class="h" x="38" y="145">先跑流程</text><text class="n" x="38" y="200">PMS API、pre check-in、</text><text class="n" x="38" y="235">Kiosk 驗證與櫃台 SOP。</text><text class="p" x="38" y="318">低改造，高減壓</text></g>
    <g transform="translate(508 76)"><rect width="375" height="405" rx="36" fill="#f1dbc2"/><circle cx="70" cy="72" r="34" fill="#d66a34"/><text class="num" x="60" y="84">2</text><text class="h" x="38" y="145">再接門禁</text><text class="n" x="38" y="200">發卡機、QR / Wallet、</text><text class="n" x="38" y="235">邊緣設備與斷網備援。</text><text class="p" x="38" y="318">中等改造，穩定體驗</text></g>
    <g transform="translate(951 76)"><rect width="375" height="405" rx="36" fill="#2b201b"/><circle cx="70" cy="72" r="34" fill="#c65f32"/><text class="num" x="60" y="84">3</text><text class="h" x="38" y="145" fill="#fffaf3">最後加值</text><text class="n" x="38" y="200" fill="#eadbcb">AI Agent、會員 Wallet、</text><text class="n" x="38" y="235" fill="#eadbcb">CRM 與跨場域服務。</text><text class="p" x="38" y="318" fill="#fffaf3">高價值，需資料成熟</text></g>
  </g>
  <text class="n" x="105" y="930">圖片來源：Cellbedell / 智慧入住導入成本三階段示意圖</text>
</svg>
