<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Wallet 憑證進入商辦與場館概念圖</title>
  <desc id="desc">手機 Wallet、QR Code、NFC 卡與 Bluetooth 憑證，透過同一套權限邏輯進入商辦、電梯、會議室與場館。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4ea"/>
      <stop offset="0.56" stop-color="#eadbc7"/>
      <stop offset="1" stop-color="#d1ad88"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#382920"/>
      <stop offset="1" stop-color="#15100d"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f241f"/>
      <stop offset="1" stop-color="#110d0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#3f2a20" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#d7c8b5" stroke-width="1.2" opacity="0.42"/>
    </pattern>
    <style>
      .k{font-family:Arial,sans-serif;font-size:30px;letter-spacing:14px;fill:#c65f32;font-weight:800}
      .title{font-family:Georgia,serif;font-size:74px;fill:#241a16;font-weight:800}
      .dek{font-family:Arial,sans-serif;font-size:29px;fill:#6f6258;font-weight:650}
      .h{font-family:Georgia,serif;font-size:38px;fill:#241a16;font-weight:800}
      .hlight{font-family:Georgia,serif;font-size:40px;fill:#fffaf3;font-weight:800}
      .p{font-family:Arial,sans-serif;font-size:23px;fill:#342821;font-weight:800}
      .plight{font-family:Arial,sans-serif;font-size:23px;fill:#fffaf3;font-weight:800}
      .small{font-family:Arial,sans-serif;font-size:19px;fill:#786b61;font-weight:650}
      .smallLight{font-family:Arial,sans-serif;font-size:19px;fill:#eadbcb;font-weight:650}
      .micro{font-family:Arial,sans-serif;font-size:17px;letter-spacing:4px;font-weight:800}
      .line{stroke:#b9906c;stroke-width:8;stroke-linecap:round;fill:none}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.32"/>
  <circle cx="1346" cy="168" r="168" fill="#fff8ef" opacity="0.72"/>
  <circle cx="198" cy="828" r="176" fill="#c65f32" opacity="0.11"/>

  <g transform="translate(105 96)">
    <text class="k" y="0">WALLET ACCESS CREDENTIALS</text>
    <text class="title" y="92">手機裡的憑證，正在變成建築入口</text>
    <text class="dek" y="150">員工證、訪客證、會員卡與活動票券，可以共用同一套權限邏輯。</text>
  </g>

  <g transform="translate(105 258)" filter="url(#shadow)">
    <rect width="1390" height="592" rx="56" fill="#fffaf3" stroke="#decfbd" stroke-width="3"/>

    <g transform="translate(64 64)">
      <rect width="326" height="464" rx="42" fill="#f7efe6"/>
      <text class="micro" x="42" y="58" fill="#c65f32">MULTI CREDENTIAL</text>
      <g transform="translate(48 94)">
        <rect width="110" height="214" rx="30" fill="url(#phone)"/>
        <rect x="18" y="34" width="74" height="126" rx="18" fill="#fffaf3"/>
        <text class="p" x="30" y="96" font-size="18">Wallet</text>
        <circle cx="55" cy="184" r="10" fill="#fffaf3" opacity="0.7"/>
        <rect x="138" y="20" width="118" height="74" rx="22" fill="#e5efe6"/>
        <text class="p" x="166" y="65">QR</text>
        <rect x="138" y="118" width="118" height="74" rx="22" fill="#f1dbc2"/>
        <text class="p" x="158" y="163">NFC</text>
        <rect x="138" y="216" width="118" height="74" rx="22" fill="#fffaf3"/>
        <text class="p" x="148" y="261">BLE</text>
      </g>
      <text class="h" x="42" y="390">介面可以不同</text>
      <text class="small" x="42" y="428">手機、QR、卡片、藍牙都只是入口。</text>
    </g>

    <g transform="translate(462 64)">
      <rect width="462" height="464" rx="42" fill="url(#dark)"/>
      <text class="micro" x="46" y="58" fill="#f3c85e">ACCESS TASK LAYER</text>
      <text class="hlight" x="46" y="122">權限邏輯要統一</text>
      <text class="smallLight" x="46" y="168">每張憑證背後，都要回到同一組身份、時間、區域與撤回規則。</text>
      <g transform="translate(46 216)">
        <rect width="370" height="58" rx="20" fill="#fffaf3"/>
        <text class="p" x="24" y="38">Identity：員工 / 訪客 / 會員</text>
        <rect y="76" width="370" height="58" rx="20" fill="#e5efe6"/>
        <text class="p" x="24" y="114">Time Window：有效起訖</text>
        <rect y="152" width="370" height="58" rx="20" fill="#f1dbc2"/>
        <text class="p" x="24" y="190">Zone：樓層 / 門 / 場域</text>
        <rect y="228" width="370" height="58" rx="20" fill="#fffaf3"/>
        <text class="p" x="24" y="266">Revoke + Audit：撤回與紀錄</text>
      </g>
    </g>

    <g transform="translate(990 64)">
      <rect width="324" height="464" rx="42" fill="#e5efe6"/>
      <text class="micro" x="40" y="58" fill="#c65f32">SPACE TOUCHPOINTS</text>
      <g transform="translate(48 98)">
        <rect width="224" height="62" rx="20" fill="#fffaf3"/>
        <text class="p" x="30" y="40">商辦入口</text>
        <rect y="86" width="224" height="62" rx="20" fill="#f1dbc2"/>
        <text class="p" x="30" y="126">電梯樓層</text>
        <rect y="172" width="224" height="62" rx="20" fill="#fffaf3"/>
        <text class="p" x="30" y="212">會議室</text>
        <rect y="258" width="224" height="62" rx="20" fill="#2b201b"/>
        <text class="plight" x="30" y="298">場館閘門</text>
      </g>
      <text class="h" x="40" y="414">同一條任務線</text>
    </g>

    <path class="line" d="M390 296h58"/>
    <path d="M440 276l34 20-34 20" fill="#b9906c"/>
    <path class="line" d="M924 296h58"/>
    <path d="M974 276l34 20-34 20" fill="#b9906c"/>
  </g>

  <g transform="translate(158 878)">
    <rect width="1284" height="60" rx="24" fill="#fffaf3" opacity="0.84"/>
    <text class="small" x="34" y="38">圖片來源：Cellbedell / Wallet 憑證與智慧建築通行任務層概念圖</text>
  </g>
</svg>
