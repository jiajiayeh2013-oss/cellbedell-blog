<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">智慧建築身份權限模板概念圖</title>
  <desc id="desc">員工、訪客、廠商、會員與活動工作人員透過同一套 Access Policy Layer 取得不同空間權限。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7efe3"/>
      <stop offset="52%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#eaf2e7"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1">
      <stop offset="0%" stop-color="#211815"/>
      <stop offset="100%" stop-color="#4a3125"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4d3429" flood-opacity=".16"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#b8c8b6" stroke-width="1" opacity=".34"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".52"/>
  <circle cx="1430" cy="130" r="150" fill="#f0d8be" opacity=".55"/>
  <circle cx="150" cy="755" r="180" fill="#d46a36" opacity=".13"/>

  <text x="86" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#211815">智慧建築的身份權限模板</text>
  <text x="90" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-size="23" letter-spacing="8" fill="#c45f35">WHO · WHEN · WHERE · REVOKE</text>

  <g filter="url(#shadow)">
    <rect x="82" y="205" width="420" height="520" rx="44" fill="#fffaf3" stroke="#e2d3c0" stroke-width="2"/>
    <text x="126" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="9" fill="#c45f35">IDENTITY</text>
    <text x="126" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#211815">不同的人</text>

    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#211815">
      <rect x="126" y="374" width="310" height="62" rx="22" fill="#e9f0e6"/>
      <circle cx="160" cy="405" r="17" fill="#6e835b"/>
      <text x="194" y="414">員工 Employee</text>

      <rect x="126" y="458" width="310" height="62" rx="22" fill="#f1dcc4"/>
      <circle cx="160" cy="489" r="17" fill="#d46a36"/>
      <text x="194" y="498">訪客 Visitor</text>

      <rect x="126" y="542" width="310" height="62" rx="22" fill="#f6f0e8"/>
      <circle cx="160" cy="573" r="17" fill="#211815"/>
      <text x="194" y="582">廠商 Vendor</text>

      <rect x="126" y="626" width="310" height="62" rx="22" fill="#e9f0e6"/>
      <circle cx="160" cy="657" r="17" fill="#6e835b"/>
      <text x="194" y="666">會員 Member</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="578" y="196" width="444" height="548" rx="48" fill="url(#dark)"/>
    <text x="634" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="8" fill="#f4c864">ACCESS POLICY LAYER</text>
    <text x="634" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="700" fill="#fffaf3">同一套規則</text>
    <text x="634" y="382" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#e6d6c7">把身份轉成時間、區域、審核與撤回條件。</text>

    <g font-family="'Helvetica Neue', Arial, sans-serif" fill="#211815">
      <rect x="634" y="430" width="150" height="82" rx="24" fill="#fffaf3"/>
      <text x="673" y="465" font-size="21" letter-spacing="5" fill="#c45f35">WHEN</text>
      <text x="670" y="496" font-size="25" font-weight="700">有效時間</text>

      <rect x="816" y="430" width="150" height="82" rx="24" fill="#fffaf3"/>
      <text x="858" y="465" font-size="21" letter-spacing="5" fill="#c45f35">WHERE</text>
      <text x="852" y="496" font-size="25" font-weight="700">可進區域</text>

      <rect x="634" y="540" width="150" height="82" rx="24" fill="#fffaf3"/>
      <text x="678" y="575" font-size="21" letter-spacing="5" fill="#c45f35">WHO</text>
      <text x="670" y="606" font-size="25" font-weight="700">誰核准</text>

      <rect x="816" y="540" width="150" height="82" rx="24" fill="#fffaf3"/>
      <text x="846" y="575" font-size="21" letter-spacing="5" fill="#c45f35">REVOKE</text>
      <text x="852" y="606" font-size="25" font-weight="700">何時失效</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1095" y="205" width="420" height="520" rx="44" fill="#fffaf3" stroke="#e2d3c0" stroke-width="2"/>
    <text x="1138" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="9" fill="#c45f35">SPACE</text>
    <text x="1138" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#211815">不同空間</text>

    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#211815">
      <rect x="1138" y="374" width="140" height="70" rx="22" fill="#e9f0e6"/>
      <text x="1183" y="418">大廳</text>
      <rect x="1300" y="374" width="140" height="70" rx="22" fill="#f1dcc4"/>
      <text x="1339" y="418">電梯</text>

      <rect x="1138" y="466" width="140" height="70" rx="22" fill="#f6f0e8"/>
      <text x="1171" y="510">會議室</text>
      <rect x="1300" y="466" width="140" height="70" rx="22" fill="#e9f0e6"/>
      <text x="1339" y="510">停車</text>

      <rect x="1138" y="558" width="140" height="70" rx="22" fill="#f1dcc4"/>
      <text x="1171" y="602">後台區</text>
      <rect x="1300" y="558" width="140" height="70" rx="22" fill="#f6f0e8"/>
      <text x="1339" y="602">機房</text>
    </g>
  </g>

  <path d="M520 465 C548 465 548 465 575 465" stroke="#b98b5f" stroke-width="12" stroke-linecap="round"/>
  <path d="M560 432 L600 465 L560 498" fill="none" stroke="#b98b5f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1038 465 C1066 465 1066 465 1092 465" stroke="#b98b5f" stroke-width="12" stroke-linecap="round"/>
  <path d="M1078 432 L1118 465 L1078 498" fill="none" stroke="#b98b5f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="300" y="778" width="1000" height="76" rx="30" fill="#fffaf3" stroke="#e0d2c1" stroke-width="2"/>
    <text x="350" y="826" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#211815">Wallet · QR Code · NFC Card · Kiosk · Door Reader 都回到同一套身份權限模板。</text>
  </g>

  <text x="90" y="866" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#6b5d53">Source: Cellbedell / 智慧建築身份權限模板概念圖</text>
</svg>
