<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">智慧建築憑證到現場設備執行流程</title>
  <desc id="desc">Wallet、QR Code、NFC 卡與 Kiosk 經由身份權限模板連接門禁、電梯、會議室與稽核紀錄。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset=".52" stop-color="#f6ecdf"/>
      <stop offset="1" stop-color="#eaf2e7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4a3125" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1400" cy="160" r="170" fill="#f0d4b9" opacity=".48"/>
  <text x="90" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#211815">憑證只是入口，現場設備才是執行點</text>
  <text x="96" y="144" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="8" fill="#c45f35">CREDENTIALS → POLICY → EDGE EXECUTION</text>

  <g filter="url(#shadow)" font-family="'Helvetica Neue', Arial, sans-serif">
    <rect x="88" y="215" width="350" height="500" rx="44" fill="#fffaf3" stroke="#e0d2c1" stroke-width="2"/>
    <text x="132" y="282" font-size="22" letter-spacing="8" fill="#c45f35">FRONT DOOR</text>
    <text x="132" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#211815">多種憑證</text>
    <g font-size="25" font-weight="700" fill="#211815">
      <rect x="132" y="385" width="230" height="56" rx="18" fill="#e9f0e6"/><text x="170" y="421">Wallet Pass</text>
      <rect x="132" y="465" width="230" height="56" rx="18" fill="#f0dcc5"/><text x="185" y="501">QR Code</text>
      <rect x="132" y="545" width="230" height="56" rx="18" fill="#f6efe7"/><text x="190" y="581">NFC Card</text>
      <rect x="132" y="625" width="230" height="56" rx="18" fill="#e9f0e6"/><text x="204" y="661">Kiosk</text>
    </g>

    <rect x="625" y="245" width="350" height="440" rx="48" fill="#211815"/>
    <text x="675" y="320" font-size="22" letter-spacing="8" fill="#f4c864">POLICY</text>
    <text x="675" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" fill="#fffaf3">身份權限層</text>
    <text x="675" y="438" font-size="25" fill="#e6d6c7">誰、何時、去哪裡</text>
    <text x="675" y="485" font-size="25" fill="#e6d6c7">誰核准、何時失效</text>
    <text x="675" y="532" font-size="25" fill="#e6d6c7">是否留下紀錄</text>

    <rect x="1162" y="215" width="350" height="500" rx="44" fill="#fffaf3" stroke="#e0d2c1" stroke-width="2"/>
    <text x="1206" y="282" font-size="22" letter-spacing="8" fill="#c45f35">ON SITE</text>
    <text x="1206" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#211815">現場執行</text>
    <g font-size="25" font-weight="700" fill="#211815">
      <rect x="1206" y="385" width="230" height="56" rx="18" fill="#e9f0e6"/><text x="1262" y="421">門禁讀頭</text>
      <rect x="1206" y="465" width="230" height="56" rx="18" fill="#f0dcc5"/><text x="1275" y="501">電梯</text>
      <rect x="1206" y="545" width="230" height="56" rx="18" fill="#f6efe7"/><text x="1262" y="581">會議室</text>
      <rect x="1206" y="625" width="230" height="56" rx="18" fill="#e9f0e6"/><text x="1262" y="661">稽核紀錄</text>
    </g>
  </g>

  <path d="M455 462 H608" stroke="#bf9062" stroke-width="14" stroke-linecap="round"/>
  <path d="M590 418 L642 462 L590 506" fill="none" stroke="#bf9062" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M993 462 H1145" stroke="#bf9062" stroke-width="14" stroke-linecap="round"/>
  <path d="M1127 418 L1179 462 L1127 506" fill="none" stroke="#bf9062" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="92" y="835" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6b5d53">Source: Cellbedell / 智慧建築憑證到現場設備執行流程概念圖</text>
</svg>
