<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 智慧建築任務層概念圖</title>
  <desc id="desc">自然語言需求經由 AI Agent 轉換成訪客、門禁、電梯、會議室、櫃台通知與稽核紀錄任務。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7efe3"/>
      <stop offset="48%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#e9f2ec"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" x2="1">
      <stop offset="0%" stop-color="#1f1714"/>
      <stop offset="100%" stop-color="#513326"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5a3b2c" flood-opacity=".16"/>
    </filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#b9c7b8" stroke-width="1" opacity=".32"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".55"/>
  <circle cx="1420" cy="120" r="150" fill="#f2d8be" opacity=".48"/>
  <circle cx="130" cy="760" r="180" fill="#d46a36" opacity=".13"/>
  <circle cx="1190" cy="760" r="210" fill="#6e835b" opacity=".12"/>

  <text x="88" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#211815">AI Agent 管理智慧建築服務任務</text>
  <text x="92" y="145" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" letter-spacing="8" fill="#c45f35">FROM CONVERSATION TO ACCESS TASKS</text>

  <g filter="url(#shadow)">
    <rect x="86" y="215" width="390" height="525" rx="44" fill="#fffaf3" stroke="#e0d2c1" stroke-width="2"/>
    <text x="132" y="278" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="9" fill="#c45f35">REQUEST</text>
    <text x="132" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#211815">一句需求</text>
    <rect x="132" y="388" width="298" height="164" rx="28" fill="#f1e1cf"/>
    <text x="160" y="442" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#3e302a">明天下午三位訪客</text>
    <text x="160" y="482" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#3e302a">到 12 樓會議室，</text>
    <text x="160" y="522" font-family="'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#3e302a">幫我開通通行。</text>
    <rect x="132" y="590" width="140" height="70" rx="22" fill="#6e835b"/>
    <text x="166" y="637" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#fffaf3">人</text>
    <rect x="290" y="590" width="140" height="70" rx="22" fill="#d46a36"/>
    <text x="323" y="637" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#fffaf3">空間</text>
  </g>

  <path d="M500 478 C546 478 556 478 602 478" stroke="#b98b5f" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M588 438 L638 478 L588 518" fill="none" stroke="#b98b5f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="645" y="196" width="430" height="562" rx="48" fill="url(#agent)"/>
    <text x="700" y="272" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="9" fill="#f4c864">AI AGENT</text>
    <text x="700" y="337" font-family="Georgia, 'Times New Roman', serif" font-size="49" font-weight="700" fill="#fffaf3">任務解析層</text>
    <text x="700" y="386" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#e6d6c7">理解需求，套用規則，建立任務卡。</text>

    <rect x="700" y="430" width="320" height="70" rx="22" fill="#fffaf3"/>
    <circle cx="738" cy="465" r="20" fill="#6e835b"/>
    <text x="771" y="473" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#211815">檢查身份與接待人</text>

    <rect x="700" y="522" width="320" height="70" rx="22" fill="#fffaf3"/>
    <circle cx="738" cy="557" r="20" fill="#d46a36"/>
    <text x="771" y="565" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#211815">設定時間與區域</text>

    <rect x="700" y="614" width="320" height="70" rx="22" fill="#fffaf3"/>
    <circle cx="738" cy="649" r="20" fill="#f4c864"/>
    <text x="771" y="657" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#211815">送出審核與紀錄</text>
  </g>

  <path d="M1095 478 C1138 478 1146 478 1190 478" stroke="#b98b5f" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M1176 438 L1226 478 L1176 518" fill="none" stroke="#b98b5f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="1238" y="216" width="274" height="524" rx="44" fill="#fffaf3" stroke="#e0d2c1" stroke-width="2"/>
    <text x="1284" y="278" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" letter-spacing="9" fill="#c45f35">EXECUTION</text>
    <text x="1284" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#211815">現場系統</text>

    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#211815">
      <rect x="1284" y="386" width="182" height="54" rx="18" fill="#e8f0e6"/>
      <text x="1328" y="421">訪客憑證</text>
      <rect x="1284" y="462" width="182" height="54" rx="18" fill="#f0dcc5"/>
      <text x="1328" y="497">門禁權限</text>
      <rect x="1284" y="538" width="182" height="54" rx="18" fill="#e8f0e6"/>
      <text x="1328" y="573">電梯樓層</text>
      <rect x="1284" y="614" width="182" height="54" rx="18" fill="#f0dcc5"/>
      <text x="1328" y="649">通知稽核</text>
    </g>
  </g>

  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#6b5d53">
    <text x="90" y="815">AI Agent 不直接決定開門，而是把人的需求轉成可審核、可執行、可撤回的空間服務任務。</text>
    <text x="90" y="852">Source: Cellbedell / AI Agent 智慧建築任務層概念圖</text>
  </g>
</svg>
