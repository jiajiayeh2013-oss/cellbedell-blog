<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 門禁權限治理主圖</title>
  <desc id="desc">一張具有雜誌感的旅宿後台工作台圖，呈現 AI Agent 將門禁需求轉成審核、撤回與稽核任務。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4ea"/>
      <stop offset="0.58" stop-color="#efe2cf"/>
      <stop offset="1" stop-color="#d9b995"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#372920"/>
      <stop offset="1" stop-color="#17110e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d66a34"/>
      <stop offset="1" stop-color="#748864"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#3f2a20" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="62" height="62" patternUnits="userSpaceOnUse">
      <path d="M62 0H0V62" fill="none" stroke="#d7c9b7" stroke-width="1.4" opacity="0.42"/>
    </pattern>
    <style>
      .k{font-family:Arial,sans-serif;font-size:30px;letter-spacing:14px;fill:#c65f32;font-weight:800}
      .title{font-family:Georgia,serif;font-size:74px;fill:#241a16;font-weight:800}
      .dek{font-family:Arial,sans-serif;font-size:29px;fill:#6f6258;font-weight:650}
      .h{font-family:Georgia,serif;font-size:38px;fill:#241a16;font-weight:800}
      .p{font-family:Arial,sans-serif;font-size:24px;fill:#342821;font-weight:800}
      .small{font-family:Arial,sans-serif;font-size:20px;fill:#786b61;font-weight:650}
      .tiny{font-family:Arial,sans-serif;font-size:18px;fill:#fffaf3;font-weight:750;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.34"/>
  <circle cx="1338" cy="170" r="168" fill="#fff8ef" opacity="0.72"/>
  <circle cx="214" cy="832" r="174" fill="#c65f32" opacity="0.11"/>

  <g transform="translate(105 96)">
    <text class="k" y="0">AI AGENT ACCESS</text>
    <text class="title" y="92">門禁權限不是開關，是一張任務卡</text>
    <text class="dek" y="150">把一句自然語言，轉成可審核、可撤回、可追蹤的旅宿通行流程。</text>
  </g>

  <g transform="translate(112 258)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1376" height="592" rx="52" fill="#fffaf3" stroke="#ded1c1" stroke-width="3"/>

    <g transform="translate(72 70)">
      <rect width="410" height="450" rx="38" fill="url(#screen)"/>
      <text class="tiny" x="42" y="64">GUEST REQUEST</text>
      <text class="h" x="42" y="128" fill="#fffaf3">今晚臨時通行</text>
      <text class="small" x="42" y="184" fill="#e8d7c5">「幫 303 房客多開一組</text>
      <text class="small" x="42" y="218" fill="#e8d7c5">今晚到明天中午有效的權限」</text>
      <rect x="42" y="284" width="318" height="92" rx="26" fill="#fffaf3"/>
      <circle cx="88" cy="330" r="26" fill="#d66a34"/>
      <path d="M88 312v36M70 330h36" stroke="#fffaf3" stroke-width="8" stroke-linecap="round"/>
      <text class="p" x="128" y="323">自然語言輸入</text>
      <text class="small" x="128" y="352">由 Agent 轉成結構化任務</text>
    </g>

    <g transform="translate(560 70)">
      <rect width="365" height="450" rx="38" fill="#e5efe6"/>
      <text class="k" x="38" y="64" font-size="24">TASK CARD</text>
      <text class="h" x="38" y="126">任務卡</text>
      <g transform="translate(38 170)">
        <rect width="288" height="56" rx="18" fill="#fffaf3"/>
        <text class="p" x="24" y="37">房號 303</text>
        <rect y="74" width="288" height="56" rx="18" fill="#fffaf3"/>
        <text class="p" x="24" y="111">有效至 12:00</text>
        <rect y="148" width="288" height="56" rx="18" fill="#fffaf3"/>
        <text class="p" x="24" y="185">區域：房門 / 電梯</text>
        <rect y="222" width="288" height="56" rx="18" fill="#fffaf3"/>
        <text class="p" x="24" y="259">風險：需櫃台確認</text>
      </g>
    </g>

    <g transform="translate(1000 70)">
      <rect width="300" height="450" rx="38" fill="#f1dbc2"/>
      <text class="k" x="36" y="64" font-size="24">CONTROL</text>
      <text class="h" x="36" y="126">治理層</text>
      <g transform="translate(42 176)">
        <circle cx="36" cy="36" r="36" fill="#748864"/>
        <path d="M22 37l12 12 23-28" fill="none" stroke="#fffaf3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="p" x="88" y="30">審核</text>
        <text class="small" x="88" y="61">人機協作確認</text>
        <circle cx="36" cy="142" r="36" fill="#d66a34"/>
        <path d="M20 142h32M52 128l18 14-18 14" fill="none" stroke="#fffaf3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="p" x="88" y="136">撤回</text>
        <text class="small" x="88" y="167">退房 / 換房 / 遺失</text>
        <circle cx="36" cy="248" r="36" fill="#2b201b"/>
        <path d="M20 235h32M20 250h48M20 265h26" stroke="#fffaf3" stroke-width="8" stroke-linecap="round"/>
        <text class="p" x="88" y="242">稽核</text>
        <text class="small" x="88" y="273">誰、何時、哪張卡</text>
      </g>
    </g>

    <path d="M502 296h48" stroke="#b9906c" stroke-width="10" stroke-linecap="round"/>
    <path d="M542 276l34 20-34 20" fill="#b9906c"/>
    <path d="M934 296h48" stroke="#b9906c" stroke-width="10" stroke-linecap="round"/>
    <path d="M974 276l34 20-34 20" fill="#b9906c"/>
  </g>

  <text class="small" x="112" y="920">圖片來源：Cellbedell / AI Agent 門禁權限治理概念圖</text>
</svg>
